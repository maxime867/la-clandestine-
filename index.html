<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projet Narcos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Carte conceptuelle dessinée à la main : cercle au centre, branches à gauche et à droite, flèches au feutre ; outils en pastilles blanches par-dessus */
:root{
  --paper:#f2fbf4; --ink:#1f1d24; --ink2:#55525e; --card:#ffffff; --line:#1f1d24;
  --fait:#3fbf7f; --pas:#ef5b6b; --reflexion:#f5b82e;
  --center:#a6dbe6;
  --hand:"Patrick Hand","Comic Sans MS","Segoe Print",system-ui,sans-serif;
  --marker:"Permanent Marker","Patrick Hand","Comic Sans MS",system-ui,sans-serif;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #4d7cff;outline-offset:2px}
.paper{position:fixed;inset:0;background-color:var(--paper);background-image:radial-gradient(rgba(31,29,36,.07) 1.2px,transparent 1.2px);background-size:28px 28px}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.smooth{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links path{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s}
.node{position:absolute;left:0;top:0;transition:opacity .25s;will-change:transform}
.box{position:relative;transform:translate(-50%,-50%) rotate(var(--rot,0deg));width:var(--w,190px);min-height:62px;padding:12px 16px;border-radius:30px 26px 32px 24px / 26px 32px 24px 30px;
  background:var(--c);box-shadow:7px 8px 0 var(--sh);display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s;font-family:var(--hand);font-size:19px;line-height:1.12;color:var(--tc,var(--ink));word-break:break-word}
@media (hover:hover){.box:hover{transform:translate(-50%,calc(-50% - 4px)) rotate(var(--rot,0deg));box-shadow:9px 12px 0 var(--sh)}}
.node.l1 .box{min-height:96px;font-size:23px;padding:16px 18px}
.node.sel .box{outline:3px dashed var(--ink);outline-offset:6px}
.node.dim{opacity:.22}
.node.dragging,.node.dragging *{transition:none!important}
.node.dragging{z-index:5;pointer-events:none}
.node.dragging .box{box-shadow:14px 18px 0 var(--sh);transform:translate(-50%,-50%) rotate(calc(var(--rot,0deg) + 2deg)) scale(1.05)}
.node.drop .box{outline:4px dashed #4d7cff;outline-offset:7px}
.node.carried{transition:none!important}
.dropTip{position:fixed;z-index:8;pointer-events:none;font-weight:800;font-size:13px;background:#4d7cff;color:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:4px 12px;white-space:nowrap}
.node.hit .box{outline:4px solid #4d7cff;outline-offset:5px}
.node.new .box{animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.badge{position:absolute;top:-12px;right:-10px;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--ui);font-weight:800;font-size:15px;color:#fff;transform:rotate(8deg)}
.more{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);font-family:var(--ui);font-size:12px;font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:99px;padding:0 8px;line-height:20px}
.tog{position:absolute;top:0;margin-top:-17px;height:34px;min-width:34px;padding:0 9px;border-radius:99px;border:2.5px solid var(--ink);background:var(--card);font-family:var(--ui);font-weight:800;font-size:14px;box-shadow:3px 3px 0 rgba(31,29,36,.2);transition:transform .15s,background .15s}
.node.right .tog{left:calc(var(--w,190px)/2 + 12px)}.node.left .tog{right:calc(var(--w,190px)/2 + 12px)}
.tog:hover{transform:scale(1.1);background:#ffe27a}
.node.open .tog{min-width:30px;height:30px;margin-top:-15px;padding:0}
.plus{position:absolute;top:44px;width:30px;height:30px;margin-top:-15px;border-radius:50%;border:2.5px solid var(--ink);background:var(--card);font-family:var(--ui);font-weight:800;font-size:18px;line-height:1;display:grid;place-items:center;opacity:0;transition:opacity .15s,transform .15s}
.node.right .plus{left:calc(var(--w,190px)/2 + 12px)}.node.left .plus{right:calc(var(--w,190px)/2 + 12px)}
@media (hover:hover){.node:hover .plus{opacity:1}}.node.sel .plus{opacity:1}
.plus:hover{transform:scale(1.15);background:#ffe27a}
.peers{position:absolute;left:0;top:0;transform:translate(-50%,-62px);display:flex;gap:3px;pointer-events:none}
.pchip{font-family:var(--ui);font-size:11px;font-weight:800;border-radius:99px;padding:1px 8px;color:var(--ink);border:2px solid var(--ink);white-space:nowrap}
.node.root .box{width:250px;height:250px;min-height:0;border-radius:50%;flex-direction:column;gap:6px;background:var(--center);box-shadow:8px 10px 0 #7fb9c6;font-family:var(--marker);font-size:30px;line-height:1}
@media (hover:hover){.node.root .box:hover{transform:translate(-50%,calc(-50% - 4px))}}
.root .pct{font-family:var(--hand);font-size:22px;background:var(--card);border:2.5px solid var(--ink);border-radius:99px;padding:2px 14px}
.root .sub{font-family:var(--hand);font-size:18px;color:var(--ink2)}
.root .tap{font-family:var(--ui);font-size:12px;font-weight:800;color:var(--ink2)}
.arc{position:absolute;left:0;top:0;width:420px;height:240px;transform:translate(-50%,-238px);overflow:visible;pointer-events:none}
.arc text{font-family:var(--marker);font-size:38px;fill:var(--ink);letter-spacing:2px}
.addBranch{position:absolute;left:0;top:0;transform:translate(-50%,152px);font-family:var(--ui);font-weight:800;font-size:14px;background:var(--card);border:2.5px solid var(--ink);border-radius:99px;padding:8px 16px;box-shadow:4px 5px 0 rgba(31,29,36,.18);white-space:nowrap}
.addBranch:hover{background:#ffe27a}
.pill{background:var(--card);border:2.5px solid var(--ink);border-radius:18px;box-shadow:4px 5px 0 rgba(31,29,36,.16)}
#top{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.brand{padding:6px 14px;font-family:var(--marker);font-size:20px}
.stats{display:flex;gap:6px;padding:5px}
.stat{display:flex;align-items:center;gap:6px;border:2px solid transparent;background:none;border-radius:12px;padding:5px 10px;font-weight:800;font-size:13.5px}
.stat i{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:11px;color:#fff;background:var(--c)}
.stat b{font-variant-numeric:tabular-nums}
.stat[aria-pressed="true"]{border-color:var(--ink);background:#fff5cc}
.search{display:flex;align-items:center;gap:6px;padding:3px 6px 3px 12px;flex:1 1 170px;max-width:280px;min-width:0}
.search input{border:0;outline:0;background:none;min-width:0;width:100%;font-weight:700;font-size:14px;padding:6px 0}
.who{display:flex;align-items:center;gap:6px;padding:3px 10px;width:150px}
.who input{border:0;outline:0;background:none;min-width:0;width:100%;font-weight:800;font-size:14px;padding:6px 0}
.live{margin-left:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;font-weight:800;color:var(--ink2)}
.live .dot{width:10px;height:10px;border-radius:50%;background:var(--fait);border:2px solid var(--ink)}
.live.off .dot{background:var(--reflexion)}.live.err .dot{background:var(--pas)}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:800;margin-left:-7px}
.av:first-child{margin-left:0}
#zoom{position:fixed;z-index:5;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:16px}
#zoom button{width:40px;height:40px;border:0;border-radius:11px;background:none;font-size:20px;font-weight:800}
#zoom button:hover{background:#fff5cc}
#zoom .z{font-size:11px;text-align:center;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}
#hist{position:fixed;z-index:5;left:calc(max(12px,env(safe-area-inset-left,0px)) + 62px);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:5px;border-radius:16px}
#hist button{display:flex;align-items:center;gap:6px;height:40px;border:0;border-radius:11px;background:none;padding:0 12px;font-weight:800;font-size:14px}
#hist button b{font-size:20px;line-height:1}
#hist button:hover:not(:disabled){background:#fff5cc}
#hist button:disabled{opacity:.3;cursor:default}
.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap;border-radius:99px}
#panel{position:fixed;z-index:6;top:calc(78px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:min(350px,calc(100% - 24px));max-height:calc(100% - 100px);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;border-radius:24px;box-shadow:7px 8px 0 rgba(31,29,36,.2)}
.ph{display:flex;align-items:center;gap:8px}
.crumb{flex:1;min-width:0;font-size:12px;font-weight:800;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pundo{height:34px;border-radius:99px;border:2px solid var(--ink);background:var(--card);font-weight:800;font-size:13px;padding:0 12px}
.pundo:disabled{opacity:.3;cursor:default}
.x{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea{border:2.5px solid var(--ink);border-radius:14px;padding:9px 12px;background:#fbfffc;outline:0}
.field input{font-family:var(--hand);font-size:22px}
.field textarea{font-family:var(--ui);font-size:14px;font-weight:600;min-height:80px;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus{background:#fffbea}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;border:2.5px solid var(--ink);background:var(--card);border-radius:14px;padding:8px;font-weight:800;font-size:13.5px}
.seg button i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--c);font-style:normal;font-size:10px;color:#fff;display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--c);box-shadow:3px 4px 0 var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:7px}
.sw button,.sw .custom{width:29px;height:29px;border-radius:50%;border:2.5px solid var(--ink);background:var(--c);padding:0;flex:none}
.sw button[aria-pressed="true"],.sw .custom.on{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--ink)}
.sw .same{width:auto;border-radius:99px;padding:0 10px;font-size:12px;font-weight:800;background:var(--card)}
.sw .custom{position:relative;display:grid;place-items:center;cursor:pointer;background:conic-gradient(#ff6b6b,#ffd43b,#69db7c,#3bc9db,#4dabf7,#9775fa,#f783ac,#ff6b6b);overflow:hidden}
.sw .custom span{font-weight:800;font-size:16px;line-height:1;color:var(--ink);background:#fff;border-radius:50%;width:17px;height:17px;display:grid;place-items:center}
.sw .custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:2.5px solid var(--ink);border-radius:14px;padding:10px;font-weight:800;font-size:13.5px;background:var(--card);box-shadow:3px 4px 0 rgba(31,29,36,.22)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(31,29,36,.22)}
.btn.main{background:#ffe27a}
.btn.danger{color:#c4283a}
.btn.solid{background:var(--pas);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.confirm{border:2.5px dashed var(--pas);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;font-weight:700;font-size:14px}
.meta{font-size:12px;font-weight:700;color:var(--ink2);margin:0}
.ro{font-size:13px;font-weight:800;color:#b37a00;margin:0}
#toast{position:fixed;z-index:9;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;font-weight:800;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:640px){
  .stats{order:3;width:100%;justify-content:space-between}.stat{flex:1;justify-content:center;padding:5px 4px;font-size:12px}
  .search{order:2;max-width:none}.live{order:1}.brand{font-size:17px}
  #panel{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));width:auto;max-height:60%}
  .hint{display:none}
  #hist{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px))}#hist button{height:36px;padding:0 10px;font-size:13px}
  .brand{display:none}
  .stats{order:2;width:auto}.stat .lbl{display:none}.stat{flex:none;padding:5px 8px;font-size:14px}
  .search{order:1;flex:1 1 100%}.who{order:2;flex:1;width:auto}.live{order:3;margin-left:0;flex:1;justify-content:center;font-size:12px}
  #zoom{flex-direction:row;align-items:center}#zoom button{width:36px;height:36px}#zoom .z{min-width:40px}
}
@media (max-width:1180px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){.node,#world.smooth,.box{transition:none}.node.new .box{animation:none}}
</style>
</head>
<body>
<div class="paper" aria-hidden="true"></div>
<div id="stage" aria-label="Carte du projet Narcos : glisse pour te déplacer, molette ou pincement pour zoomer">
  <div id="world"><svg id="links" aria-hidden="true"></svg><div id="nodes"></div></div>
</div>

<header id="top">
  <div class="brand pill">Projet Narcos</div>
  <div class="stats pill" role="group" aria-label="Filtrer par statut">
    <button class="stat" data-f="fait" style="--c:var(--fait)" aria-pressed="false"><i>✓</i><span class="lbl">Fait</span> <b id="nFait">0</b></button>
    <button class="stat" data-f="pas" style="--c:var(--pas)" aria-pressed="false"><i>✕</i><span class="lbl">Pas fait</span> <b id="nPas">0</b></button>
    <button class="stat" data-f="reflexion" style="--c:var(--reflexion)" aria-pressed="false"><i>?</i><span class="lbl">À réfléchir</span> <b id="nRef">0</b></button>
  </div>
  <label class="search pill"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Chercher une idée…" aria-label="Chercher une idée" autocomplete="off"></label>
  <label class="who pill" title="Ton prénom, pour que l’équipe voie qui modifie"><span aria-hidden="true">👤</span><input id="nick" maxlength="20" placeholder="Ton prénom" aria-label="Ton prénom" autocomplete="off"></label>
  <div class="live pill off" id="live" role="status"><span class="dot"></span><span id="liveTxt">Connexion…</span><span class="avs" id="avs"></span></div>
</header>

<div id="zoom" class="pill">
  <button id="zin" aria-label="Zoomer">+</button><div class="z" id="zval">100 %</div><button id="zout" aria-label="Dézoomer">−</button><button id="zfit" aria-label="Tout voir" title="Tout voir">⤢</button>
</div>
<div id="hist" class="pill" role="group" aria-label="Historique">
  <button id="undo" disabled title="Annuler ma dernière modification (Ctrl+Z)"><b aria-hidden="true">↶</b>Annuler</button>
  <button id="redo" disabled title="Rétablir (Ctrl+Maj+Z)"><b aria-hidden="true">↷</b>Rétablir</button>
</div>
<div class="hint pill"><b>+5</b> montre les idées · clique pour modifier · <b>glisse une boîte</b> pour la déplacer, lâche-la sur une autre pour l’y ranger</div>

<aside id="panel" class="pill" hidden aria-label="Modifier l’idée">
  <div class="ph"><span class="crumb" id="crumb"></span><button class="pundo" id="pundo" disabled title="Annuler ma dernière modification">↶ Annuler</button><button class="x" id="pclose" aria-label="Fermer">✕</button></div>
  <p class="ro" id="ro" hidden>Lecture seule : pour modifier, demande au propriétaire de te partager la carte en Contributeur ou Éditeur.</p>
  <div class="field"><label for="ptitle">Idée</label><input id="ptitle" maxlength="80" autocomplete="off"></div>
  <div class="field" id="statusField"><label>Où on en est</label>
    <div class="seg" id="seg">
      <button data-s="fait" style="--c:var(--fait)" aria-pressed="false"><i>✓</i>Fait</button>
      <button data-s="pas" style="--c:var(--pas)" aria-pressed="false"><i>✕</i>Pas fait</button>
      <button data-s="reflexion" style="--c:var(--reflexion)" aria-pressed="false"><i>?</i>À réfléchir</button>
      <button data-s="" style="--c:#ffffff" aria-pressed="false"><i style="color:var(--ink)">·</i>Sans statut</button>
    </div></div>
  <div class="field" id="colorField"><label id="colorLbl">Couleur de la branche</label><div class="sw" id="sw"></div></div>
  <div class="field"><label for="pnote">Détails</label><textarea id="pnote" maxlength="2000" placeholder="Précisions, qui s’en occupe…"></textarea></div>
  <div class="acts">
    <button class="btn main" id="addChild">+ Sous-idée</button>
    <button class="btn" id="addSib">+ Idée voisine</button>
    <button class="btn" id="fold">Replier</button>
    <button class="btn danger" id="del">Retirer</button>
    <button class="btn" id="reset" style="grid-column:1/-1">Remettre à sa place</button>
  </div>
  <div class="confirm" id="confirm" hidden><span id="confirmTxt"></span><div class="acts"><button class="btn solid" id="delYes">Oui, retirer</button><button class="btn" id="delNo">Annuler</button></div></div>
  <p class="meta" id="meta"></p>
</aside>
<div id="toast" class="pill" hidden role="status"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const PALETTE=['#bfc3e6','#8ecdb3','#7a83c4','#ffcc5c','#a8dce6','#f7a8c4','#f5a878','#e3a6cf','#f19a98','#a6dcd6',
  '#ff6b6b','#ff8fab','#ffa94d','#ffd43b','#fff3a3','#c0eb75','#69db7c','#63e6be','#3bc9db','#74c0fc','#4dabf7','#9775fa','#d0bfff','#e599f7','#c8a27a','#ced4da'];
const HEX=/^#[0-9a-fA-F]{6}$/;
const lum=h=>{const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const ST={fait:{hex:'#3fbf7f',sym:'✓',label:'Fait'},pas:{hex:'#ef5b6b',sym:'✕',label:'Pas fait'},reflexion:{hex:'#f5b82e',sym:'?',label:'À réfléchir'}};
const ROOT='root';
/* ---------- état ---------- */
const nodes=new Map();
let db=null,user=null,room=null,canWrite=true,mode='loading',myId=null;
/* ---------- serveur Netlify : /api/carte (la carte entière, numérotée), sondage toutes les 1,5 s ---------- */
const API='/api/carte';let api=false,remoteV=0,inflight=0;
const CID=(()=>{try{let c=sessionStorage.getItem('narcos-c');if(!c){c=Math.random().toString(36).slice(2,12);sessionStorage.setItem('narcos-c',c)}return c}catch(e){return Math.random().toString(36).slice(2,12)}})();
let myName='';try{myName=localStorage.getItem('narcos-nom')||''}catch(e){}
async function call(body){const r=await fetch(API,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});if(!r.ok)throw {code:'http_'+r.status};return r.json()}
function applyDoc(res){
  if(!res||res.same||!res.nodes)return false;
  if(typeof res.v==='number'&&res.v<remoteV)return false;

function loadLocal(){let a=null;try{a=JSON.parse(localStorage.getItem('narcos-local')||'null')}catch(e){}for(const n of (Array.isArray(a)&&a.length?a:SEED))if(n&&n.id)nodes.set(n.id,n)}
let pollT=0,polling=false;
async function poll(force){
  clearTimeout(pollT);
  if(!polling&&api&&!(drag&&drag.on)){polling=true;
    try{const r=await fetch(API+'?v='+(force?0:remoteV)+'&c='+CID,{cache:'no-store'}).then(x=>{if(!x.ok)throw 0;return x.json()});
      if(mode!=='live'){mode='live';setLive()}
      applyPeers(r.online);
      if(!inflight&&!pending.size&&applyDoc(r)){initFold();render()}else renderPeers();
    }catch(e){if(mode==='live'){mode='err';setLive()}}
    polling=false}
  pollT=setTimeout(poll,document.hidden?6000:1500);
}
async function start(){
  const nk=$('nick');nk.value=myName;nk.addEventListener('change',()=>{myName=nk.value.trim().slice(0,20);try{localStorage.setItem('narcos-nom',myName)}catch(e){}ping()});
  render();fit();setLive();
  try{const r=await call();api=true;mode='live';applyDoc(r);applyPeers(r.online);initFold();render();fit(true);setLive();ping();poll()}
  catch(e){mode='local';loadLocal();initFold();render();fit();setLive()}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll(true)});
  setInterval(ping,10000);
}
/* pas de sélection de texte sur la carte (seulement dans les champs) */
document.addEventListener('selectstart',e=>{const t=e.target&&(e.target.closest?e.target:e.target.parentElement);if(!t||!t.closest('input,textarea'))e.preventDefault()});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('#stage'))e.preventDefault()});
if(document.fonts)document.fonts.ready.then(()=>{H.clear();render()});
start();
